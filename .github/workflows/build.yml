name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build EspressoLog IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select installed Xcode
        run: |
          DEVELOPER_DIR=$(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | sort | tail -n 1)
          if [ -z "$DEVELOPER_DIR" ]; then
            echo "No Xcode installation found"
            exit 1
          fi
          echo "Using $DEVELOPER_DIR"
          sudo xcode-select -switch "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Unsigned for Sideloading)
        run: |
          xcodebuild build \
            -project EspressoLog.xcodeproj \
            -scheme EspressoLog \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/EspressoLog.app Payload/
          zip -r EspressoLog.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EspressoLog-IPA
          path: EspressoLog.ipa
          retention-days: 7

      - name: Create / Update GitHub Release for AltStore
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Dial-In (EspressoLog)"
          body: "Automated build of Dial-In for AltStore source. Download the IPA or add the source URL to AltStore."
          files: EspressoLog.ipa
          prerelease: false
          make_latest: true
